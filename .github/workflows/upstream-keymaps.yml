name: Update upstream keymaps

on:
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-keymaps
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      base: ${{ steps.update.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - run: sudo apt-get update && sudo apt-get install -y ruby rake
      - name: Generate stable upstream updates
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cargo run --locked --manifest-path updater/Cargo.toml -- update
          if ! git diff --quiet -- config/keymap.json config/glove80.keymap upstream-lock.json; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-keymaps
          retention-days: 1
          path: |
            config/keymap.json
            config/glove80.keymap
            upstream-lock.json
          if-no-files-found: error

  propose:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require a token that triggers PR validation
        env:
          UPDATE_TOKEN: ${{ secrets.UPSTREAM_UPDATE_TOKEN }}
        run: test -n "$UPDATE_TOKEN" || { echo 'Configure UPSTREAM_UPDATE_TOKEN; see README.md.'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.generate.outputs.base }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upstream-keymaps
          path: proposed
      - name: Publish review branch and PR
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_UPDATE_TOKEN }}
        run: |
          branch=chore/upstream-keymap-releases
          expected=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          if [ -n "$expected" ]; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            unchanged=true
            for path in config/keymap.json config/glove80.keymap upstream-lock.json; do
              git show "$expected:$path" > previous-output
              if ! cmp -s previous-output "proposed/$path"; then
                unchanged=false
              fi
            done
            rm previous-output
            if [ "$unchanged" = true ]; then
              echo 'Existing review branch already contains these outputs.'
              exit 0
            fi
          fi
          git switch -c "$branch"
          cp proposed/config/keymap.json config/keymap.json
          cp proposed/config/glove80.keymap config/glove80.keymap
          cp proposed/upstream-lock.json upstream-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/keymap.json config/glove80.keymap upstream-lock.json
          git commit -m 'chore(keymap): update upstream releases'
          gh auth setup-git
          git push --force-with-lease="refs/heads/$branch:$expected" origin "HEAD:refs/heads/$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title 'chore(keymap): update upstream releases' --body-file .github/upstream-pr.md
          fi
