name: Upstream keymap updater

on:
  pull_request:
    paths:
      - 'updater/**'
      - 'config/**'
      - 'upstream-lock.json'
      - '.github/workflows/upstream-keymaps.yml'
      - '.github/workflows/updater-validation.yml'

permissions:
  contents: read

jobs:
  updater-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y ruby rake
      - run: cargo fmt --manifest-path updater/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path updater/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path updater/Cargo.toml
      - name: Verify locked generation and independent Enthium changes
        run: cargo run --locked --manifest-path updater/Cargo.toml -- check
    name: >-
      Upstream keymap updater / Formatting, static analysis, tests and generation validation
